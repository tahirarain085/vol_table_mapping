<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tree Register{% endblock %}</title>
  <!-- Fonts load when online; the page falls back to system fonts when offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Tree register</h1>
        <p>{% block tagline %}Enter girth, get dia, cft and shi unit. Totals are worked out for you.{% endblock %}</p>
      </div>
      <div class="topbar-actions">
        {% block topbar_actions %}{% endblock %}
        {% if user %}
          <span class="who">Signed in as <strong>{{ user.full_name }}</strong></span>
          <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-ghost">Sign out</button>
          </form>
        {% endif %}
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
